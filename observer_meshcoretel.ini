[env:LilyGo_TBeam_1W_observer_meshcoretel]
extends = env:LilyGo_TBeam_1W_repeater
; stock 1.25MB app partition cannot fit WiFi+MQTT uplink; min_spiffs gives a 1.92MB app
; slot and keeps SPIFFS for identity/prefs (trade-off: no OTA slot on this board)
board_build.partitions = min_spiffs.csv
build_flags = ${env:LilyGo_TBeam_1W_repeater.build_flags} -D WITH_MQTT_UPLINK=1
build_src_filter = ${env:LilyGo_TBeam_1W_repeater.build_src_filter} +<helpers/mqtt/*.cpp>

