; meshcoretel observer uplink firmware environments (mqtt-uplink branch)
; repeater firmware + WiFi/MQTT telemetry to mqtt.meshcoretel.ru, included
; via extra_configs in the root platformio.ini

[env:Heltec_v2_observer_meshcoretel]
extends = env:Heltec_v2_repeater
build_flags = ${env:Heltec_v2_repeater.build_flags} -D WITH_MQTT_UPLINK=1
build_src_filter = ${env:Heltec_v2_repeater.build_src_filter} +<helpers/mqtt/*.cpp>

