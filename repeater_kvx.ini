; KVX-flavoured vanilla repeaters (mqtt-uplink branch): stock repeater role,
; no WiFi/MQTT, only first-boot KVX regional defaults

[env:Heltec_v4_repeater_kvx]
extends = env:heltec_v4_repeater
build_flags = ${env:heltec_v4_repeater.build_flags} -D WITH_KVX_DEFAULTS=1

[env:Heltec_v3_repeater_kvx]
extends = env:Heltec_v3_repeater
build_flags = ${env:Heltec_v3_repeater.build_flags} -D WITH_KVX_DEFAULTS=1

[env:ProMicro_repeater_kvx]
extends = env:ProMicro_repeater
build_flags = ${env:ProMicro_repeater.build_flags} -D WITH_KVX_DEFAULTS=1

[env:Heltec_t114_repeater_kvx]
extends = env:Heltec_t114_repeater
build_flags = ${env:Heltec_t114_repeater.build_flags} -D WITH_KVX_DEFAULTS=1

[env:Heltec_t096_repeater_kvx]
extends = env:Heltec_t096_repeater
build_flags = ${env:Heltec_t096_repeater.build_flags} -D WITH_KVX_DEFAULTS=1

[env:LilyGo_T-Echo_repeater_kvx]
extends = env:LilyGo_T-Echo_repeater
build_flags = ${env:LilyGo_T-Echo_repeater.build_flags} -D WITH_KVX_DEFAULTS=1
